name: Daily odds snapshot

# Fetches Polymarket win-probabilities once a day and commits a dated snapshot to
# the owned archive (history.json + history.js), so the chart survives the market.
on:
  schedule:
    - cron: "0 6 * * *"   # 06:00 UTC daily
  workflow_dispatch: {}    # allow manual runs from the Actions tab

permissions:
  contents: write

concurrency:
  group: odds-snapshot
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Take daily snapshot
        run: node scripts/odds-snapshot.mjs
      - name: Refresh social-share card (assets/og.png)
        run: |
          python3 -m pip install --quiet pillow
          python3 scripts/og-image.py
      - name: Commit if changed
        run: |
          git config user.name "wc26-odds-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add history.json history.js assets/og.png
          if git diff --cached --quiet; then
            echo "No change today."; exit 0
          fi
          git commit -m "chore: odds snapshot $(date -u +%F)"
          git push
