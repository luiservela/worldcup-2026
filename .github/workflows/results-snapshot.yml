name: Results snapshot

# Re-scrapes Wikipedia's fixtures every few hours and bakes finished scores +
# resolved knockout teams into schedule.js, so results are self-owned and persist
# even if the live score feed goes away.
on:
  schedule:
    - cron: "20 * * * *"   # hourly at :20 — keep committed scores fresh during the tournament
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: results-snapshot
  cancel-in-progress: false

jobs:
  results:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Regenerate schedule from Wikipedia
        run: node scripts/results-snapshot.mjs
      - name: Commit if changed
        run: |
          git config user.name "wc26-results-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add schedule.js
          if git diff --cached --quiet; then
            echo "No change."; exit 0
          fi
          git commit -m "chore: results $(date -u +%FT%H:%MZ)"
          git pull --rebase --autostash origin main || true
          git push
